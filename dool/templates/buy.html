{% extends 'base.html' %}

{% block content %}

<h2>{{ product.name }}</h2>

<form method="POST">
{% csrf_token %}

<input
type="text"
name="name"
placeholder="Your Name"
required>

<input
type="text"
name="phone"
placeholder="Phone Number"
required>

<input
type="text"
name="location"
placeholder="Nearest Town"
required>

<button type="submit">
Send To WhatsApp
</button>

</form>

{% endblock %}
