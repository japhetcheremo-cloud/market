{% extends 'base.html' %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h2>Create Account</h2>
        <p>Join our shop today</p>

        <a href="#" class="google-btn">
            Continue with Google
        </a>

        <div class="divider">
            <span>OR</span>
        </div>

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Create Account
            </button>
        </form>

        <div class="auth-footer">
            Already have an account?
            <a href="{% url 'login' %}">Login</a>
        </div>

    </div>

</div>

{% endblock %}
